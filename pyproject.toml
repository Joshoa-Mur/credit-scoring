
[project]
name = "credit-scoring"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "catboost>=1.2.8",
    "fastapi>=0.115",
    "joblib>=1.4",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.6",
    "uvicorn>=0.30",
]


[dependency-groups]
dev = [
    "pytest",     
    "httpx",      
    "locust",
    "ruff"
]

[build-system]
requires = ["uv_build>=0.10 ,<0.11"]
build-backend = "uv_build"

