
[project]
name = "credit-scoring"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "catboost>=1.2.8",
    "fastapi>=0.115",
    "joblib>=1.4",
    "mlflow-skinny>=3.16,<4",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "scikit-learn==1.9.0",
    "uvicorn>=0.30",
]


[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "locust",
    "ruff",
    "matplotlib>=3.11.2",
    "dvc>=3.67.1",
]

[build-system]
requires = ["uv_build>=0.10 ,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: нужна база данных - адрес в DATABASE_URL"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ['E' , 'F' , 'I' , 'B' , 'UP']

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

