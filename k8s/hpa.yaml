# HPA раз в 15 с смотрит на CPU подов и держит среднюю загрузку около 60% от requests.cpu.
# Метрики даёт metrics-server (ставится в platform/up.sh).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-scoring
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: credit-scoring}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
